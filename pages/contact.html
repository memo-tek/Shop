<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html" id="logo">SNEAKR</a>
        <button
          type="button"
          id="menu-toggle"
          aria-label="Toggle navigation menu"
          aria-expanded="false"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div id="nav-link-container">
          <a href="index.html" class="nav-link">SHOP</a>
          <a href="about.html" class="nav-link">ABOUT</a>
          <a href="contact.html" class="nav-link">CONTACT</a>
        </div>
        <a href="#" id="cart-link" aria-label="Shopping cart">
          <i id="bag" class="fa-solid fa-bag-shopping" aria-hidden="true"></i>
          <span id="cart-count" aria-label="Items in cart">0</span>
        </a>
      </nav>
    </header>

    <main>
      <section id="contact-container">
        <div id="left-contact-container">
          <h1 id="contact-heading">GET IN TOUCH</h1>
          <p class="info-text">
            Lorem ipsum dolor, sit amet consectetur adipisicing elit. Officia
            deleniti eligendi perferendis, accusantium commodi error voluptate
            distinctio obcaecati ipsam velit.
          </p>
          <div id="contact-info-container">
            <div class="contact-icon-card">
              <i class="contact-icon-img fa-solid fa-envelope" aria-hidden="true"></i>
              <div>
                <p class="bold">Email</p>
                <p>mohammed.2406160@su.edu.eg</p>
              </div>
            </div>

            <div class="contact-icon-card">
              <i class="contact-icon-img fa-solid fa-phone" aria-hidden="true"></i>
              <div>
                <p class="bold">Phone</p>
                <p>+201069013253</p>
              </div>
            </div>

            <div class="contact-icon-card">
              <i class="contact-icon-img fa-solid fa-location-dot" aria-hidden="true"></i>
              <div>
                <p class="bold">Location</p>
                <p>Cairo, Egypt</p>
              </div>
            </div>
          </div>
        </div>
        <div id="right-contact-container">
          <form id="contact-form" action="" method="post">
            <label class="contact-label" for="name">Name</label>
            <input
              class="contact-input"
              type="text"
              name=""
              id="name"
              placeholder="Full Name"
            />
            <label class="contact-label" for="email">Email</label>
            <input
              class="contact-input"
              type="email"
              name=""
              id="email"
              placeholder="Email"
            />
            <label class="contact-label" for="message">Message</label>
            <textarea
              class="contact-textarea"
              name=""
              id="message"
              placeholder="Write your message..."
            ></textarea>
            <button type="submit" class="dark-btn-green">Send Message</button>
            <p id="form-status" role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>

    <footer>
      <a href="https://www.facebook.com">
        <i class="social-icon fa-brands fa-facebook" aria-hidden="true"></i>
      </a>
      <a href="https://www.facebook.com">
        <i class="social-icon fa-brands fa-instagram" aria-hidden="true"></i>
      </a>
      <a href="https://www.facebook.com">
        <i class="social-icon fa-brands fa-youtube" aria-hidden="true"></i>
      </a>
    </footer>
    <script src="../js/script.js" defer></script>
  </body>
</html>
