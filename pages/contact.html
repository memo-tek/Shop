<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html" id="logo">SNEAKR</a>
        <div id="nav-link-container">
          <a href="index.html" class="nav-link">SHOP</a>
          <a href="about.html" class="nav-link">ABOUT</a>
          <a href="contact.html" class="nav-link">CONTACT</a>
        </div>
        <a href="">
          <img id="bag" src="../img/shopping-bag.png" alt="" />
        </a>
      </nav>
    </header>

    <main>
      <section id="contact-container">
        <div id="left-contact-container">
          <h1 id="contact-heading">GET IN TOUCH</h1>
          <p class="info-text">
            Lorem ipsum dolor, sit amet consectetur adipisicing elit. Officia
            deleniti eligendi perferendis, accusantium commodi error voluptate
            distinctio obcaecati ipsam velit.
          </p>
          <div id="contact-info-container">
            <div class="contact-icon-card">
              <img class="contact-icon-img" src="../img/email.png" alt="" />
              <div>
                <p class="bold">Email</p>
                <p>mohammed.2406160@su.edu.eg</p>
              </div>
            </div>

            <div class="contact-icon-card">
              <img
                class="contact-icon-img"
                src="../img/phone-call.png"
                alt=""
              />
              <div>
                <p class="bold">Phone</p>
                <p>+201069013253</p>
              </div>
            </div>

            <div class="contact-icon-card">
              <img
                class="contact-icon-img"
                src="../img/gps-navigation.png"
                alt=""
              />
              <div>
                <p class="bold">Location</p>
                <p>Cairo, Egypt</p>
              </div>
            </div>
          </div>
        </div>
        <div id="right-contact-container">
          <form action="" method="post">
            <label class="contact-label" for="name">Name</label>
            <input
              class="contact-input"
              type="text"
              name=""
              id="name"
              placeholder="Full Name"
            />
            <label class="contact-label" for="email">Email</label>
            <input
              class="contact-input"
              type="email"
              name=""
              id="email"
              placeholder="Email"
            />
            <label class="contact-label" for="message">Message</label>
            <textarea
              class="contact-textarea"
              name=""
              id="message"
              placeholder="Write your message..."
            ></textarea>
            <button type="submit" class="dark-btn-green">Send Message</button>
          </form>
        </div>
      </section>
    </main>

    <footer>
      <a href="https://www.facebook.com">
        <img src="../img/facebook.png" alt="" />
      </a>
      <a href="https://www.facebook.com">
        <img src="../img/instagram.png" alt="" />
      </a>
      <a href="https://www.facebook.com">
        <img src="../img/youtube.png" alt="" />
      </a>
    </footer>
  </body>
</html>
