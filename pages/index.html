<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html" id="logo">SNEAKR</a>
        <button
          type="button"
          id="menu-toggle"
          aria-label="Toggle navigation menu"
          aria-expanded="false"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div id="nav-link-container">
          <a href="index.html" class="nav-link">SHOP</a>
          <a href="about.html" class="nav-link">ABOUT</a>
          <a href="contact.html" class="nav-link">CONTACT</a>
        </div>
        <a href="#" id="cart-link" aria-label="Shopping cart">
          <i id="bag" class="fa-solid fa-bag-shopping" aria-hidden="true"></i>
          <span id="cart-count" aria-label="Items in cart">0</span>
        </a>
      </nav>
      <div id="banner">
        <div id="left-banner">
          <h1>STEP INTO THE FUTURE</h1>
          <p class="info-text">
            Lorem ipsum dolor sit amet consecte. Lorem ipsum dolor sit amet
            consectetur.
          </p>
          <button type="button" class="dark-btn-green" id="shop-now-btn">
            SHOP NOW
          </button>
        </div>
        <div id="right-banner">
          <img id="right-banner-img" src="../img/shoe.png" alt="" />
        </div>
      </div>
    </header>
    <main>
      <section id="featured">
        <h2 class="section-heading">FEATURED SHOES</h2>
        <div id="card-container"></div>
      </section>

      <section id="advertisment">
        <div id="advertisment-container">
          <h2 id="advertisment-heading">ENGINEERING FOR PERFORMANCE</h2>
          <p id="advertisment-text">
            Lorem ipsum dolor sit amet consectetur adipisicing elit.
            Necessitatibus, vel ratione.
          </p>
          <button type="button" class="btn-green center-sm" id="discover-btn">
            DISCOVER MORE
          </button>
        </div>
      </section>
    </main>
    <footer>
      <a href="https://www.facebook.com">
        <i class="social-icon fa-brands fa-facebook" aria-hidden="true"></i>
      </a>
      <a href="https://www.facebook.com">
        <i class="social-icon fa-brands fa-instagram" aria-hidden="true"></i>
      </a>
      <a href="https://www.facebook.com">
        <i class="social-icon fa-brands fa-youtube" aria-hidden="true"></i>
      </a>
    </footer>
    <script src="../js/script.js" defer></script>
  </body>
</html>
